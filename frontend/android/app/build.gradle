apply plugin: 'com.android.application'

// Credenciales de firma de release: busca key.properties en android-keystores/saludya/ o tramitexpress/
def releaseKeystorePropertiesFile = new File(System.getProperty('user.home'), 'android-keystores/saludya/key.properties')
if (!releaseKeystorePropertiesFile.exists()) {
    releaseKeystorePropertiesFile = new File(System.getProperty('user.home'), 'android-keystores/tramitexpress/key.properties')
}
def releaseKeystoreProperties = new Properties()
def hasReleaseSigning = false
if (releaseKeystorePropertiesFile.exists()) {
    releaseKeystoreProperties.load(new FileInputStream(releaseKeystorePropertiesFile))
    hasReleaseSigning = true
} else if (System.getenv("RELEASE_STORE_FILE")) {
    releaseKeystoreProperties.setProperty('storeFile', System.getenv("RELEASE_STORE_FILE"))
    releaseKeystoreProperties.setProperty('storePassword', System.getenv("RELEASE_STORE_PASSWORD"))
    releaseKeystoreProperties.setProperty('keyAlias', System.getenv("RELEASE_KEY_ALIAS"))
    releaseKeystoreProperties.setProperty('keyPassword', System.getenv("RELEASE_KEY_PASSWORD"))
    hasReleaseSigning = true
}

android {
    namespace = "com.elpentagonodigital.saludya"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    flavorDimensions "portal"
    productFlavors {
        pacientes {
            dimension "portal"
            applicationId "com.elpentagonodigital.saludya"
            resValue "string", "app_name", "SaludYa"
            resValue "string", "package_name", "com.elpentagonodigital.saludya"
        }
        profesionales {
            dimension "portal"
            def customAppId = project.findProperty('profesionalAppId') ?: System.getenv('PROFESIONAL_APPLICATION_ID') ?: 'com.elpentagonodigital.saludya.profesionales'
            applicationId customAppId
            resValue "string", "app_name", "SaludYa Profesionales"
            resValue "string", "package_name", customAppId
        }
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseKeystoreProperties['storeFile'])
                storePassword releaseKeystoreProperties['storePassword']
                keyAlias releaseKeystoreProperties['keyAlias']
                keyPassword releaseKeystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig = signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
